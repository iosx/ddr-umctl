# This memory map is for the Micron MT41K256M16 (DDR3L) device:
# - Density    : 4G bits
# - Organization: 32M words x 16 bits x 8 banks
#  - Bank Address: BA0 ~ BA2
#  - Bank Group:   none (DDR3)
#  - Row Address:  A0 ~ A14 (15 row bits, A15 not present)
#  - Column Address: A0 ~ A9
#  - Page size:    2 KB
# You can use this for other devices with the same organization:
#  - Micron MT41K256M16 / MT41J256M16
#  - Alliance AS4C256M16D3
# This memory map will also work with inline ECC enabled (2 bank rotation).
#
# Derived from configs/memory/ddr3_512Mx16_2B.yaml (8G-bit x16 device) by
# removing one address bit, since this device provides half the capacity:
# - ADDRMAP_ROW_B15 is unused (15 row bits) and is tied off with the
#   documented "unused" value 15.
# - The three highest column bits (COL_B7/B8/B9) must still map to the
#   highest three used HIF address bits, so their values drop from 19
#   (HIF bits 26/27/28) to 18 (HIF bits 25/26/27). Leaving them at 19 would
#   leave HIF bit 25 unmapped, causing address aliasing.
# The map therefore covers HIF bits 2..27 exactly once, i.e. 512 MBytes.
---
addrmap0:
  ADDRMAP_CS_BIT0: 31
addrmap1:
  ADDRMAP_BANK_B0: 1
  ADDRMAP_BANK_B1: 4
  ADDRMAP_BANK_B2: 4
addrmap2:
  ADDRMAP_COL_B2: 0
  ADDRMAP_COL_B3: 1
  ADDRMAP_COL_B4: 1
  ADDRMAP_COL_B5: 1
addrmap3:
  ADDRMAP_COL_B6: 3
  ADDRMAP_COL_B7: 18
  ADDRMAP_COL_B8: 18
  ADDRMAP_COL_B9: 18
addrmap4:
  ADDRMAP_COL_B10: 31
  ADDRMAP_COL_B11: 31
addrmap5:
  ADDRMAP_ROW_B0: 4
  ADDRMAP_ROW_B1: 4
  ADDRMAP_ROW_B2_10: 4
  ADDRMAP_ROW_B11: 4
addrmap6:
  ADDRMAP_ROW_B12: 4
  ADDRMAP_ROW_B13: 4
  ADDRMAP_ROW_B14: 4
  ADDRMAP_ROW_B15: 15
  LPDDR3_6GB_12GB: 0
addrmap7:
  ADDRMAP_ROW_B16: 15
  ADDRMAP_ROW_B17: 15
addrmap8:
  ADDRMAP_BG_B0: 63
  ADDRMAP_BG_B1: 63
